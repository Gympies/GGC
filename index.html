<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGC Display Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Minimalistische Header / Status */
    .status-bar {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 0.75rem;
      color: #666;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .logo-container {
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .logo-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
    }
    .logo-title span {
      color: #d92525;
    }

    /* Iconen / Knoppen Grid */
    .button-grid {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      max-width: 900px;
      width: 90%;
    }

    .icon-card {
      background: #111111;
      border: 2px solid #222222;
      border-radius: 16px;
      width: 220px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .icon-card:hover {
      border-color: #d92525;
      transform: translateY(-5px);
      background: #181818;
      box-shadow: 0 8px 30px rgba(217, 37, 37, 0.25);
    }

    .icon-card svg {
      width: 54px;
      height: 54px;
      fill: #ffffff;
      margin-bottom: 1rem;
      transition: fill 0.25s ease;
    }

    .icon-card:hover svg {
      fill: #d92525;
    }

    .icon-card span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cccccc;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Fullscreen Frame Overlay */
    #display-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }

    #display-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Subtiele Terug-knop (zweeft linksonder, vervaagt automatisch) */
    .exit-btn {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 10000;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }
    .exit-btn:hover {
      opacity: 1;
      background: #d92525;
      border-color: #d92525;
    }
  </style>
</head>
<body>

  <div class="status-bar" id="res-display">Resolutie: Laden...</div>

  <div class="logo-container">
    <div class="logo-title">GGC <span>DISPLAY</span></div>
  </div>

  <div class="button-grid">
    <!-- Icon 1: Score per toestel -->
    <div class="icon-card" onclick="openDisplay('toestel')">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      <span>Score Toestel</span>
    </div>

    <!-- Icon 2: Sponsorpresentatie -->
    <div class="icon-card" onclick="openDisplay('sponsors')">
      <svg viewBox="0 0 24 24">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
      </svg>
      <span>Sponsors</span>
    </div>

    <!-- Icon 3: Algemeen Overzicht -->
    <div class="icon-card" onclick="openDisplay('algemeen')">
      <svg viewBox="0 0 24 24">
        <path d="M16 11V3H8v8H2v10h20V11h-6zm-6-6h4v14h-4V5zm-6 8h4v6H4v-6zm16 6h-4v-6h4v6z"/>
      </svg>
      <span>Algemeen Overzicht</span>
    </div>
  </div>

  <!-- Fullscreen Container voor HDMI Weergave -->
  <div id="display-container">
    <button class="exit-btn" onclick="closeDisplay()">✕ Sluiten (Esc)</button>
    <iframe id="display-frame" src=""></iframe>
  </div>

  <script>
    let urls = {};

    // 1. URLs inladen vanuit config.json
    async function loadConfig() {
      try {
        const response = await fetch('config.json?v=' + new Date().getTime());
        urls = await response.json();
      } catch (e) {
        console.error("Kon config.json niet laden, val terug op placeholders.", e);
      }
    }

    // 2. Schermresolutie uitlezen
    function updateResolution() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      document.getElementById('res-display').innerText = `HDMI: ${w}x${h}`;
    }

    window.addEventListener('resize', updateResolution);
    window.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      updateResolution();
    });

    // 3. Openen in Fullscreen
    function openDisplay(key) {
      const targetUrl = urls[key];
      if (!targetUrl) {
        alert("Geen URL ingesteld in config.json voor: " + key);
        return;
      }

      const container = document.getElementById('display-container');
      const frame = document.getElementById('display-frame');
      
      frame.src = targetUrl;
      container.style.display = 'block';

      // Vraag browser-fullscreen aan
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(()=>{});
      }
    }

    // 4. Sluiten / Terug naar menu
    function closeDisplay() {
      const container = document.getElementById('display-container');
      const frame = document.getElementById('display-frame');
      
      container.style.display = 'none';
      frame.src = '';

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(()=>{});
      }
    }

    // Esc-toets ondersteuning
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDisplay();
    });
  </script>
</body>
</html>
